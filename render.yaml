# Free web service; use a separate persistent Neon PostgreSQL database.
# Deliberately does not create a Render database or any paid resource.
services:
  - type: web
    name: studylens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_DEMO_ONLY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_CLOUDFLARE
        value: "false"
# APP_ORIGIN defaults to the provider's RENDER_EXTERNAL_URL.
