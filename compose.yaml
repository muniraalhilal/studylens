services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studylens
      POSTGRES_USER: studylens
      POSTGRES_PASSWORD: studylens_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - studylens_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studylens"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  studylens_pg:
